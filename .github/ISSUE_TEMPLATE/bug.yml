name: Bug report
description: Report a reproducible FUI defect.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: FUI version
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 6000.3.22f1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest project, code, or exact steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console and Editor.log
      render: shell
