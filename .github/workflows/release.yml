name: Publish GitHub release

on:
  push:
    tags:
      - 'com.fujisheng.fui*/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and package version
        shell: bash
        run: |
          package_id="${GITHUB_REF_NAME%/*}"
          tag_version="${GITHUB_REF_NAME##*/}"
          package_version="$(jq -r '.version' "Packages/$package_id/package.json")"
          test -f "Packages/$package_id/package.json"
          test "$tag_version" = "$package_version"
          tools/verify-repository.sh --structure-only
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
